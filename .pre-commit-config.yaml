# Local guardrails. Install once per clone: `pre-commit install`
# (https://pre-commit.com). CI runs the same gitleaks version over the full history.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Runs: gitleaks git --pre-commit --redact --staged --verbose
      # Exits non-zero on any finding. Never wrap this in `|| true`.
      - id: gitleaks
