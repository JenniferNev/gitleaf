# Azure Pipelines equivalent of .github/workflows/ci.yml
trigger:
  branches:
    include: [main]
pr:
  branches:
    include: ['*']

pool:
  vmImage: ubuntu-latest

variables:
  PNPM_HOME: $(Pipeline.Workspace)/.pnpm

stages:
  - stage: CI
    jobs:
      - job: build
        displayName: Build, test, lint
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '24.x'
          - script: corepack enable && corepack prepare pnpm@10.18.3 --activate
            displayName: Enable pnpm
          - script: pnpm install --frozen-lockfile
            displayName: Install
          - script: pnpm build
            displayName: Build
          - script: pnpm test
            displayName: Test
          - script: pnpm lint
            displayName: Lint
          - script: pnpm gitleaf validate
            displayName: gitleaf validate
          - script: pnpm check:generated
            displayName: Generated schema types are up to date

      - job: guards
        displayName: Identity guard and theme contrast
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '24.x'
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
          - script: corepack enable && corepack prepare pnpm@10.18.3 --activate
            displayName: Enable pnpm
          - script: pnpm install --frozen-lockfile
            displayName: Install
          - script: bash scripts/check-identity.sh
            displayName: Identity guard
          - script: pnpm check:themes
            displayName: Theme contrast and drift

      - job: secrets
        displayName: Secret scan (full history, pinned gitleaks)
        steps:
          - checkout: self
            fetchDepth: 0
          - script: echo "##vso[task.setvariable variable=GITLEAKS]$(bash scripts/install-gitleaks.sh)"
            displayName: Install pinned gitleaks (sha256 verified)
          - script: '"$(GITLEAKS)" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .'
            displayName: Full-history scan
          - script: GITLEAKS="$(GITLEAKS)" bash scripts/test-secret-guard.sh
            displayName: Planted fake key is blocked
